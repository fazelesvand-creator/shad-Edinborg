<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>SHAD Token Checker</title>
    <style>
        body { font-family: sans-serif; background:#111; color:#fff; text-align:center }
        input, button { padding:10px; width:90%; max-width:400px }
        .box { background:#222; padding:20px; margin:20px auto; max-width:500px }
    </style>
</head>
<body>

<h2>🔐 بررسی توکن شاد</h2>

<form method="POST">
    <input name="token" placeholder="توکن شاد را وارد کنید" required>
    <br><br>
    <button type="submit">بررسی</button>
</form>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

{% if result %}
<div class="box">
    <p>وضعیت: {{ "معتبر" if result.valid else "نامعتبر" }}</p>
    <p>نام: {{ result.name }}</p>
    <p>شماره: {{ result.phone }}</p>
    <p>نقش: {{ result.role }}</p>
    <p>آخرین لاگین: {{ result.last_login }}</p>
</div>
{% endif %}

</body>
</html>
